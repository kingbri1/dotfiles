[dotfiles]
"~/.zshrc" = {}
"~/.config/ghostty" = { mode = "symlink-each" }
"~/.zsh_plugins.txt" = {}

[bootstrap.repos]
"~/.antidote" = { url = "https://github.com/mattmc3/antidote" }
"~/.config/nvim" = { url = "https://github.com/kingbri1/kickstart.nvim" }

[bootstrap.user]
login_shell = "/bin/zsh"

[tools]
colima = "latest"

[env]
EDITOR = "nvim"
VISUAL = "nvim"
ZELLIJ_CONFIG_FILE = "{{ env.HOME }}/.config/zellij/config.unix.kdl"
