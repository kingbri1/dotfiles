[dotfiles]
"~/.zshrc" = {}
"~/.config/ghostty" = { mode = "symlink-each" }
"~/.zsh_plugins.txt" = {}

[bootstrap.repos]
"~/.antidote" = { url = "https://github.com/mattmc3/antidote" }
"~/.config/nvim" = { url = "https://github.com/kingbri1/kickstart.nvim" }

[bootstrap.user]
login_shell = "/bin/zsh"

[tools]
colima = "latest"
